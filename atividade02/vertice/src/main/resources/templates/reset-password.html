<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/auth :: shell(~{::title}, ~{::.eyebrow}, ~{::.heading}, ~{::.lead}, ~{::.content})}">
<head>
    <title>Nova senha — Vértice</title>
</head>
<body>
<p class="eyebrow">Redefinição</p>
<h2 class="heading">Nova senha</h2>
<p class="lead">Digite a nova senha e confirme.</p>
<div class="content">
    <div class="alert alert-error" th:if="${invalidToken}">
        Este link de recuperação está incompleto. Solicite um novo em Recuperar senha.
        <nav class="auth-links">
            <a th:href="@{/recoverpassword}">Pedir outro link</a>
        </nav>
    </div>
    <form class="auth-form" th:unless="${invalidToken}" th:action="@{/reset-password}" th:object="${form}" method="post">
        <div class="alert alert-error" th:if="${#fields.hasGlobalErrors()}">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
        </div>
        <input type="hidden" th:field="*{token}">
        <label class="field">
            <span>Nova senha</span>
            <input type="password" th:field="*{password}" autocomplete="new-password" required>
            <p class="hint">Mínimo de 8 caracteres, com letras e números.</p>
            <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </label>
        <label class="field">
            <span>Confirmar senha</span>
            <input type="password" th:field="*{confirmPassword}" autocomplete="new-password" required>
            <p class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
        </label>
        <button class="cta" type="submit">Salvar senha</button>
        <nav class="auth-links">
            <a th:href="@{/login}">Voltar ao login</a>
        </nav>
    </form>
</div>
</body>
</html>
