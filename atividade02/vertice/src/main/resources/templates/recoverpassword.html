<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/auth :: shell(~{::title}, ~{::.eyebrow}, ~{::.heading}, ~{::.lead}, ~{::.content})}">
<head>
    <title>Recuperar senha — Vértice</title>
</head>
<body>
<p class="eyebrow">Esqueci a senha</p>
<h2 class="heading">Recuperar senha</h2>
<p class="lead">Informe o e-mail da conta para receber o link de redefinição.</p>
<div class="content">
    <form class="auth-form" th:action="@{/recoverpassword}" th:object="${form}" method="post">
        <div class="alert alert-error" th:if="${#fields.hasGlobalErrors()}">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
        </div>
        <div class="alert alert-ok" th:if="${sent}">
            Se o e-mail estiver cadastrado, as instruções de recuperação foram geradas.
            <a class="demo-link" th:if="${demoMode} and ${resetLink}" th:href="${resetLink}" th:text="${resetLink}"></a>
            <p class="hint" th:if="${demoMode} and ${resetLink}">Modo local: o envio de e-mail está desativado, então o link aparece aqui para teste.</p>
        </div>

        <label class="field">
            <span>E-mail</span>
            <input type="email" th:field="*{email}" autocomplete="email" required>
            <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </label>
        <button class="cta" type="submit">Enviar recuperação</button>
        <nav class="auth-links">
            <a th:href="@{/login}">Voltar ao login</a>
        </nav>
    </form>
</div>
</body>
</html>
