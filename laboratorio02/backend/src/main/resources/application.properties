spring.application.name=norte
server.port=8080

spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5433/aluguel}
spring.datasource.username=${SUPABASE_DB_USER:aluguel}
spring.datasource.password=${SUPABASE_DB_PASSWORD:aluguel}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.servlet.session.cookie.same-site=lax
app.cors.origem=http://localhost:5173
