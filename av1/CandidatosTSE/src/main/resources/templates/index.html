<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidatos - Eleições 2026 - MG</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <h1>Candidatos - Eleições 2026 - MG</h1>
    </header>

    <form method="get" th:action="@{/}" class="filtros">
        <label>
            Nome ou número
            <input type="text" name="texto" th:value="${textoSelecionado}">
        </label>

        <label>
            Cargo
            <select name="cargo">
                <option value="" th:selected="${cargoSelecionado == ''}">Todos</option>
                <option th:each="c : ${cargos}"
                        th:value="${c}"
                        th:text="${c}"
                        th:selected="${c == cargoSelecionado}"></option>
            </select>
        </label>

        <label>
            Partido
            <select name="partido">
                <option value="" th:selected="${partidoSelecionado == ''}">Todos</option>
                <option th:each="p : ${partidos}"
                        th:value="${p}"
                        th:text="${p}"
                        th:selected="${p == partidoSelecionado}"></option>
            </select>
        </label>

        <button type="submit">Filtrar</button>
        <a th:href="@{/}" class="limpar">Limpar</a>
    </form>

    <p class="resultado-info">
        <span th:text="${totalEncontrado}">0</span> candidato(s) encontrado(s)
    </p>

    <p th:if="${totalEncontrado == 0}" class="sem-resultado">
        Nenhum candidato encontrado com esses filtros
    </p>

    <div class="grade-candidatos">
        <div class="card" th:each="cand : ${candidatos}">
            <img th:src="@{'/images/candidatos/' + ${cand.nomeArquivoFoto}}"
                 th:alt="${cand.nomeUrna}"
                 class="foto-candidato"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
            <div class="sem-foto">Sem foto</div>

            <h2 th:text="${cand.nomeUrna}">Nome de urna</h2>
            <p class="numero" th:text="${cand.nrCandidato}">00000</p>
            <p th:text="${cand.cargo}">Cargo</p>
            <p th:text="${cand.siglaPartido}">Partido</p>

            <p class="situacao" th:if="${cand.situacaoCandidatura != null and !cand.situacaoCandidatura.isBlank()}"
               th:text="${cand.situacaoCandidatura}">Situação</p>

            <p class="extra" th:if="${cand.idade > 0}">
                <span th:text="${cand.idade + ' anos'}">idade</span>
            </p>

            <p class="extra" th:if="${cand.ocupacao != null and !cand.ocupacao.isBlank()}"
               th:text="${cand.ocupacao}">Ocupação</p>

            <p class="extra" th:if="${cand.grauInstrucao != null and !cand.grauInstrucao.isBlank()}"
               th:text="${cand.grauInstrucao}">Escolaridade</p>

            <p class="nome-civil" th:text="${cand.nomeCandidato}">Nome civil</p>
        </div>
    </div>
</body>
</html>
